<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Verity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%237fb3d5%27/%3E%3Cpath d=%27M5 6 L11.5 17 L19 5%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 fill=%27none%27/%3E%3Ccircle cx=%2711.5%27 cy=%2717%27 r=%271.5%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5 L11 17 L20 4" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="17" r="1.5" fill="white"/></svg></div>Verity</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="tests.html">Tests</a>
      <a href="dashboard.html">Dashboard</a>
    <a href="games.html">Games</a>
    <a href="about.html">About</a>
    </div>
    <div class="nav-right"><span id="theme-toggle-slot"></span><span id="nav-user-slot"></span></div>
  </nav>
</header>

<div class="page-header">
  <h1>Welcome back</h1>
  <p>Sign in to your account to continue.</p>
</div>

<section>
  <div class="container">
    <div class="auth-card">
      <h3>Sign in</h3>
      <p class="sub">Enter your username or email and password.</p>
      <div class="field"><label>Username or email</label><input type="text" id="login-id" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="handleLogin(this)">Sign in</button>
      <p class="sub" id="login-msg" style="margin-top:12px;"></p>
      <p class="sub" style="margin-top:18px;text-align:center;">Don't have an account? <a href="signup.html" style="color:var(--blue-deep);font-weight:600;">Create one</a></p>
    </div>
  </div>
</section>

<footer>
  <div class="container">Verity</div>
</footer>

<script src="app.js"></script>
<script>
  async function handleLogin(btn){
    var id = document.getElementById('login-id').value.trim();
    var pw = document.getElementById('login-password').value;
    var msg = document.getElementById('login-msg');
    if(!id || !pw){
      msg.style.color = '#c0705f';
      msg.textContent = 'Please enter your username/email and password.';
      return;
    }

    msg.style.color = 'var(--text-soft)';
    msg.textContent = 'Checking your credentials...';
    if(btn) btn.disabled = true;

    // Actually verifies against the hashed password stored at signup —
    // this used to skip that check entirely and let any password in.
    var result = await verifyCredentials(id, pw);
    if(btn) btn.disabled = false;

    if(!result.ok){
      msg.style.color = '#c0705f';
      msg.textContent = result.reason;
      return;
    }

    msg.style.color = 'var(--mint-deep)';
    msg.textContent = 'Signed in — welcome back!';
    setUser({ username: result.account.username, email: result.account.email, twoFactorEnabled: true });
    setTimeout(function(){ window.location.href = 'dashboard.html'; }, 400);
  }
</script>
</body>
</html>
