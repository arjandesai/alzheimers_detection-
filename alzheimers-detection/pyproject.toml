[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimers-detection"
version = "0.1.0"
description = "Open-source digital biomarker screening-support platform for early cognitive decline research. Not a diagnostic device."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project maintainers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.0",
    "openai-whisper>=20231117",
    "praat-parselmouth>=0.4.3",
    "spacy>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # required by FastAPI TestClient
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.urls]
Repository = "https://github.com/arjandesai/alzheimers_detection-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests requiring real model downloads (deselect with -m 'not slow')",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
